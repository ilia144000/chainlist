name: Relocate RANNTA RPC metadata

on:
  push:
    branches:
      - rannta-rpc-privacy-v2
    paths:
      - .github/workflows/rannta-rpc-relocate.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rannta-rpc-privacy-v2
          fetch-depth: 0

      - name: Patch extraRpcs
        shell: python
        run: |
          from pathlib import Path
          path = Path("constants/extraRpcs.js")
          text = path.read_text(encoding="utf-8")
          privacy_marker = "\n};\n\nexport const extraRpcs = {"
          privacy_entry = "\n  rannta:\n    \"RANNTA X-Chain public RPC does not track users or correlate RPC requests with individual users. No advertising or third-party analytics are used on the public RPC endpoint. https://rannta.com/privacy\","
          if "privacyStatement.rannta" not in text and "  rannta:\n" not in text:
              if privacy_marker not in text:
                  raise SystemExit("privacyStatement insertion marker not found")
              text = text.replace(privacy_marker, privacy_entry + privacy_marker, 1)
          rpc_marker = "\n};\n\nexport default extraRpcs;"
          rpc_entry = "\n  13113: {\n    rpcs: [\n      {\n        url: \"https://rpc.rannta.com/\",\n        tracking: \"none\",\n        trackingDetails: privacyStatement.rannta,\n      },\n    ],\n  },\n"
          if "  13113:" not in text:
              if rpc_marker not in text:
                  raise SystemExit("extraRpcs insertion marker not found")
              text = text.replace(rpc_marker, rpc_entry + "};\n\nexport default extraRpcs;", 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/rannta-rpc-relocate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constants/extraRpcs.js .github/workflows/rannta-rpc-relocate.yml
          git commit -m "fix: add RANNTA RPC metadata to extraRpcs"
          git push origin HEAD:rannta-rpc-privacy-v2
